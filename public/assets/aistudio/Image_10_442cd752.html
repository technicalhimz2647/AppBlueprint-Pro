<!DOCTYPE html><html class="dark" lang="hi"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

se-surface": "#d4e4fa", "secondary": "#7bd0ff", "outline": "#a08e7a" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-xl": "1.5rem", "space-sm": "0.5rem", "space-lg": "1rem", "gutter": "0.75rem", "margin-tablet": "1.5rem", "gutter-tablet": "1rem", "space-md": "0.75rem", "margin": "1rem", "space-xs": "0.25rem" }, "fontFamily": { "body-md": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "title-sm": ["Plus Jakarta Sans"], "headline-lg-mobile": ["Space Grotesk"], "body-lg": ["Plus Jakarta Sans"], "headline-sm": ["Space Grotesk"], "label-lg": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "headline-md": ["Space Grotesk"], "title-md": ["Plus Jakarta Sans"], "body-sm": ["Plus Jakarta Sans"], "headline-lg": ["Space Grotesk"] }, "fontSize": { "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "label-sm": ["10px", { "lineHeight": "12px", "letterSpacing": "0.05em", "fontWeight": "500" }], "title-sm": ["14px", { "lineHeight": "20px", "fontWeight": "600" }], "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "label-lg": ["13px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }], "label-md": ["11px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "600" }], "headline-md": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "title-md": ["16px", { "lineHeight": "22px", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "headline-lg": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700" }] } } } };</script></head><body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface px-margin"><div class="flex flex-col w-full max-w-md mx-auto py-2">
<!-- Top Brand Header -->
<header class="flex flex-col items-center text-center mb-3">
<!-- Emblem Logo with subtle saffron aura -->
<div class="relative flex items-center justify-center mb-2">
<div class="absolute -inset-1 rounded-2xl bg-primary-container/20 blur-md pointer-events-none"></div>
<img alt="Bihar Matric 2027 Crest" class="relative w-14 h-14 rounded-2xl object-cover bg-surface-container-highest shadow-md shadow-primary-container/20" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD5Fk3TfL3QYkietR8rW0Z123zvm_z_evU0ROlzeCMIB5KMp-m8DF5So2mMqST8d_tgTLEUK7RshNoaxPUpEF_m7oywxH9s7nyBHS69N_i7A7ic2dftBzFpHfGtIHxhJMiPD8vPvmgQe74WAPALp2-sc4ivmEoAdayFK9l1-wy9UNujiIGiQoSJP33_qwDCDzF6ABAE8Z-7TUtzGWeGFEPGqV9iUIIVvscwCh6U10QzGZWTLn2MM7_5ZRHzZKIafX_3RA">
</div>
<!-- Official Badge -->
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-high/90 text-primary mb-1">
<span class="material-symbols-outlined text-[15px]" style="font-variation-settings: 'FILL' 1;">school</span>
<span class="font-label-sm text-label-sm font-semibold tracking-wide text-primary">बिहार बोर्ड मैट्रिक परीक्षा 2027</span>
</div>
<!-- Heading -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight mt-0.5">छात्र लॉगिन</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">मोबाइल नंबर और पासवर्ड से प्रवेश करें</p>
</header>
<!-- Main Card Container -->
<section class="bg-surface-container rounded-2xl p-4 shadow-xl shadow-black/40 flex flex-col gap-3.5">
<!-- Segmented Tab Switcher -->
<div class="grid grid-cols-2 p-1 bg-surface-container-lowest rounded-xl">
<button class="w-full py-2 rounded-lg bg-primary-container text-on-primary-container font-label-lg text-label-lg font-bold shadow-md shadow-primary-container/30 transition-all flex items-center justify-center gap-1.5" id="tab-login" type="button">
<span class="material-symbols-outlined text-[17px]" style="font-variation-settings: 'FILL' 1;">login</span>
<span class="">लॉगिन करें</span>
</button>
<button class="w-full py-2 rounded-lg text-on-surface-variant font-label-lg text-label-lg font-medium transition-all flex items-center justify-center gap-1.5 hover:text-on-surface" id="tab-register" type="button">
<span class="material-symbols-outlined text-[17px]">person_add</span>
<span class="">नया खाता बनाएं</span>
</button>
</div>
<!-- Form Section -->
<form class="flex flex-col gap-3" id="auth-form" onsubmit="event.preventDefault();">
<!-- Mobile Number Field -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center justify-between" for="mobile-number">
<span class="">मोबाइल नंबर</span>
<span class="font-label-sm text-label-sm text-primary">BSEB पंजीकृत</span>
</label>
<div class="flex items-center rounded-xl bg-surface-container-lowest focus-within:bg-surface-container-low transition-all">
<div class="flex items-center gap-1 px-3 py-2.5 bg-surface-container-high rounded-l-xl text-primary font-headline-sm text-headline-sm">
<span class="font-body-sm text-body-sm font-semibold tracking-wider text-primary">🇮🇳 +91</span>
</div>
<input autocomplete="tel" class="w-full bg-transparent px-3 py-2.5 text-on-surface placeholder:text-on-surface-variant/50 font-body-md text-body-md focus:outline-none" id="mobile-number" maxlength="10" placeholder="10 अंकों का मोबाइल नंबर" required="" type="tel">
</div>
<div class="flex items-center gap-1.5 px-0.5 mt-0.5">
<span class="material-symbols-outlined text-tertiary text-[14px]" style="font-variation-settings: 'FILL' 1;">verified</span>
<span class="font-body-sm text-body-sm text-tertiary">बिना महँगे OTP के त्वरित लॉगिन</span>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface-variant" for="password-input">पासवर्ड</label>
<button class="font-label-md text-label-md text-primary font-semibold hover:underline" type="button">
            पासवर्ड भूल गए?
          </button>
</div>
<div class="flex items-center rounded-xl bg-surface-container-lowest px-3 py-2 focus-within:bg-surface-container-low transition-all">
<span class="material-symbols-outlined text-on-surface-variant/70 text-[20px] mr-2">lock</span>
<input autocomplete="current-password" class="w-full bg-transparent py-1 text-on-surface placeholder:text-on-surface-variant/50 font-body-md text-body-md focus:outline-none" id="password-input" placeholder="अपना पासवर्ड दर्ज करें" required="" type="password">
<button class="text-on-surface-variant/70 hover:text-on-surface p-1 transition-colors flex items-center justify-center" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Primary Action CTA -->
<button class="w-full mt-1.5 py-3 rounded-xl bg-primary-container text-on-primary-container font-headline-sm text-headline-sm font-bold shadow-lg shadow-primary-container/25 active:scale-[0.98] transition-transform flex items-center justify-center gap-2 hover:opacity-95" type="submit">
<span class="">लॉगिन करें</span>
<span class="material-symbols-outlined text-[20px] font-bold">arrow_forward</span>
</button>
</form>
<!-- Social Sign-in Divider -->
<div class="flex items-center gap-3 my-0.5">
<div class="flex-1 h-px bg-surface-container-highest"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest font-semibold">अथवा (OR)</span>
<div class="flex-1 h-px bg-surface-container-highest"></div>
</div>
<!-- Google Login Button -->
<button class="w-full py-2.5 px-4 rounded-xl bg-surface-container-high hover:bg-surface-container-highest text-on-surface font-label-lg text-label-lg font-semibold flex items-center justify-center gap-3 active:scale-[0.99] transition-all" type="button">
<svg aria-hidden="true" class="w-4 h-4 shrink-0" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span class="">Google के साथ जारी रखें</span>
</button>
</section>
<!-- Micro Footer Assurance -->
<div class="mt-3 flex items-center justify-center gap-1.5 text-on-surface-variant/80">
<span class="material-symbols-outlined text-[15px] text-tertiary">lock</span>
<span class="font-label-sm text-label-sm">256-bit एन्क्रिप्टेड • BSEB 2027 मान्यता प्राप्त</span>
</div>
</div>
<script>
  // Simple password reveal toggle
  const toggleBtn = document.getElementById('toggle-password');
  const passwordInput = document.getElementById('password-input');
  const eyeIcon = document.getElementById('eye-icon');

  if (toggleBtn && passwordInput && eyeIcon) {
    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
    });
  }

  // Segmented mode switcher active state toggle
  const tabLogin = document.getElementById('tab-login');
  const tabRegister = document.getElementById('tab-register');

  if (tabLogin && tabRegister) {
    const setActive = (activeTab, inactiveTab) => {
      activeTab.className = "w-full py-2 rounded-lg bg-primary-container text-on-primary-container font-label-lg text-label-lg font-bold shadow-md shadow-primary-container/30 transition-all flex items-center justify-center gap-1.5";
      inactiveTab.className = "w-full py-2 rounded-lg text-on-surface-variant font-label-lg text-label-lg font-medium transition-all flex items-center justify-center gap-1.5 hover:text-on-surface";
    };

    tabLogin.addEventListener('click', () => setActive(tabLogin, tabRegister));
    tabRegister.addEventListener('click', () => setActive(tabRegister, tabLogin));
  }
</script></main>

</body></html>
